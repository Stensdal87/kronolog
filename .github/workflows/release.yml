# Bygger Windows-installeren og Linux-pakken og opretter en GitHub-release,
# når der pushes et versions-tag, f.eks.:  git tag v0.3.0 && git push origin v0.3.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release --locked

      - name: Byg
        run: cargo build --release --locked

      - name: Installér Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Byg installer og portable exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$version installer\kronolog.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\release\kronolog.exe "dist\KronoLog-portable-$version.exe"
          # Overgang fra navnet Time Snapper: versioner før 1.0 leder efter
          # TimeSnapper-Setup-*.exe, når de opdaterer sig selv.
          Copy-Item "dist\KronoLog-Setup-$version.exe" "dist\TimeSnapper-Setup-$version.exe"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.exe

  linux:
    # Ældre Ubuntu giver en ældre glibc, så programmet også kører på ældre distributioner.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release --locked

      - name: Byg
        run: cargo build --release --locked

      - name: Pak
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="KronoLog-$version-linux-x86_64"
          mkdir -p "dist/$name"
          install -m755 target/release/kronolog "dist/$name/kronolog"
          install -m644 assets/icon.png "dist/$name/kronolog.png"
          install -m755 installer/linux/install.sh installer/linux/uninstall.sh "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.tar.gz

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Opret release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          Time Snapper hedder nu **KronoLog**. Opdaterer du fra Time Snapper, flytter KronoLog selv dine data, indstillinger og automatisk start over ved første start. Nemmest er knappen **Opdatér nu** i Time Snapper. Installerer du i stedet selv, så luk først Time Snapper helt (højreklik på ikonet i systembakken → **Afslut**).

          ## Windows

          Hent **KronoLog-Setup-$version.exe** og kør den. Den installerer kun for din bruger, så der kræves ikke administratorrettigheder.

          **KronoLog-portable-$version.exe** kan køres direkte uden installation.

          *TimeSnapper-Setup-$version.exe* er den samme installer under det gamle navn, så ældre versioner kan opdatere sig selv. Den behøver du ikke hente.

          Programmet er ikke kodesigneret, så Windows SmartScreen kan advare første gang: vælg **Flere oplysninger → Kør alligevel**.

          ## Linux

          Hent **KronoLog-$version-linux-x86_64.tar.gz**, pak den ud og kør installationsscriptet:

          \`\`\`sh
          tar xzf KronoLog-$version-linux-x86_64.tar.gz
          cd KronoLog-$version-linux-x86_64
          ./install.sh
          \`\`\`

          Det installerer for din bruger (uden root) i \`~/.local/bin\` med en genvej i programmenuen. Kør \`install.sh\` fra en ny version for at opdatere, og \`uninstall.sh\` for at fjerne programmet.

          ## Data

          Data gemmes i \`%APPDATA%\\KronoLog\\\` på Windows og \`~/.local/share/kronolog/\` på Linux og bliver liggende ved opdatering og afinstallation.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "KronoLog $version" --notes-file notes.md
