help.start:
  da: "Kom i gang"
  en: "Getting started"
help.start_body:
  da: "• Klik på et projekt i listen for at starte tiden på det. Den kørende tid står øverst under ⏱ Timer.\n• Mangler kunden eller projektet, så skriv navnet i \"Ny kunde…\" eller \"Nyt projekt…\" og tryk Enter.\n• Starter du et andet projekt, stopper det forrige af sig selv. ⏹ Stop stopper tiden helt.\n• Skriv en note til den kørende tid i 📝-feltet. Den kommer med i historikken og eksporten.\n• Under ☰ → Dagsmål kan du sætte et antal timer pr. dag. En grøn ring i uret viser, hvor langt du er (pauser tæller ikke med)."
  en: "• Click a project in the list to start time on it. The running time is shown at the top of ⏱ Timer.\n• If the customer or project is missing, type the name in \"New customer…\" or \"New project…\" and press Enter.\n• Starting another project stops the previous one. ⏹ Stop stops the time completely.\n• Write a note for the running time in the 📝 field. It is included in the history and the export.\n• Under ☰ → Daily goal you can set a number of hours per day. A green ring in the clock shows how far you are (breaks don't count)."
help.switch:
  da: "Skift eller ret den kørende tid"
  en: "Switch or correct the running time"
help.switch_body:
  da: "• ⇄ ved projektnavnet flytter den kørende tid til et andet projekt. Uret fortsætter.\n• Glemte du at skifte? Træk i skyderen i ⇄-vinduet, så flyttes kun tiden fra det klokkeslæt. Tiden før bliver på det gamle projekt.\n• Ctrl+K starter tid på et andet projekt uden at bruge musen."
  en: "• ⇄ next to the project name moves the running time to another project. The clock keeps going.\n• Forgot to switch? Drag the slider in the ⇄ window to move only the time from that point. The time before stays on the old project.\n• Ctrl+K starts time on another project without using the mouse."
help.pause:
  da: "Pause og telefon"
  en: "Breaks and phone calls"
help.pause_body:
  da: "• ☕ Pause registrerer tiden på Intern tid. ▶ Fortsæt går tilbage til projektet, hvor du slap.\n• 📞 Telefon starter tid på et opkald. Når det slutter, vælger du, hvor tiden skal hen, og tiden fortsætter på det forrige projekt.\n• Under ☰ → Opkald kan KronoLog tage telefonen af sig selv, når f.eks. Teams bruger mikrofonen."
  en: "• ☕ Break records the time on Internal time. ▶ Resume goes back to the project where you left off.\n• 📞 Phone starts time on a call. When it ends, you choose where the time goes, and time continues on the previous project.\n• Under ☰ → Calls, KronoLog can start a phone call by itself when e.g. Teams uses the microphone."
help.history:
  da: "Historik og rettelser"
  en: "History and corrections"
help.history_body:
  da: "• 📅 Historik viser én dag ad gangen. Skift dag med pilene øverst.\n• Summeret viser tiden pr. projekt. Klik på ⏵ for at se dagens registreringer for projektet.\n• Klik på en registrering for at rette tid, projekt, type eller note. Der kan du også slette den.\n• ✂ Del op i rettevinduet deler en registrering i to, f.eks. hvis du glemte at skifte projekt.\n• ➕ tilføjer en registrering, du har glemt. ⏷ ved tiden viser hver halve time, og \"min\" er varigheden. Projektlisten kan søges i, og \"+ Ny kunde…\" opretter kunden med skabelonens projekter med det samme.\n• Under Alle står huller i dagen med orange: \"+ Ikke registreret\". Klik for at udfylde hullet.\n• Uge viser ugen som et timeregnskab med afrundet tid pr. projekt og dag. Klik på en tid for at krydse den af."
  en: "• 📅 History shows one day at a time. Change day with the arrows at the top.\n• Summary shows the time per project. Click ⏵ to see the day's entries for the project.\n• Click an entry to change its time, project, type or note. You can also delete it there.\n• ✂ Split in the edit window splits an entry in two, e.g. if you forgot to switch project.\n• ➕ adds an entry you forgot. ⏷ next to the time lists every half hour, and \"min\" is the duration. The project list can be searched, and \"+ New customer…\" creates the customer with the template's projects right away.\n• Under All, gaps in the day are shown in orange: \"+ Not recorded\". Click to fill the gap.\n• Week shows the week as a timesheet with rounded time per project and day. Click a time to tick it off."
help.billing:
  da: "Afrunding og afkrydsning"
  en: "Rounding and ticking off"
help.billing_body:
  da: "• Afrundet runder tiden op til nærmeste påbegyndte kvarter. Klik på tiden for at runde ned i stedet.\n• Sæt flueben, når tiden er overført, f.eks. til fakturering. Ændres tiden bagefter, viser ⚠, hvor meget der mangler eller er for meget."
  en: "• Rounded rounds the time up to the nearest started quarter. Click the time to round down instead.\n• Tick the box when the time has been transferred, e.g. for invoicing. If the time changes afterwards, ⚠ shows how much is missing or too much."
help.lists:
  da: "Kunder og projekter"
  en: "Customers and projects"
help.lists_body:
  da: "• Højreklik på en kunde eller et projekt for at omdøbe eller slette den.\n• 📋 Vis registreringer… i samme menu viser al tid for kunden eller projektet pr. dag, uge, måned eller altid. Der kan du også rette og eksportere.\n• A–Å / Senest skifter rækkefølgen. Søgefeltet (Ctrl+F) finder kunder og projekter.\n• Under ☰ → Nye kunder kan du give alle nye kunder de samme projekter.\n• Slettede projekter forsvinder fra listen, men tiden bliver i historikken.\n• ⭐ Favorit i højrekliksmenuen sætter projektet øverst i listen og i 🔀-vælgeren.\n• ⏳ Timebudget… giver projektet et antal timer. Listen viser, hvor mange procent der er brugt, og under uret kommer en advarsel fra 90 %.\n• Under ☰ → Del kunder og projekter gemmer du listen som en fil, som en kollega kan indlæse."
  en: "• Right-click a customer or project to rename or delete it.\n• 📋 Show entries… in the same menu shows all time for the customer or project per day, week, month or all time. You can edit and export there too.\n• A–Z / Recent changes the order. The search field (Ctrl+F) finds customers and projects.\n• Under ☰ → New customers you can give all new customers the same projects.\n• Deleted projects disappear from the list, but their time stays in the history.\n• ⭐ Favourite in the right-click menu puts the project at the top of the list and in the 🔀 picker.\n• ⏳ Hour budget… gives the project a number of hours. The list shows the percentage used, and a warning appears under the clock from 90 %.\n• Under ☰ → Share customers and projects you save the list as a file a colleague can load."
help.export:
  da: "Eksport til Excel og CSV"
  en: "Export to Excel and CSV"
help.export_body:
  da: "• 📤 Eksportér… (Ctrl+E) gemmer registreringer for en periode: i dag, en uge, en måned eller fra–til.\n• Excel får to faner: alle registreringer og en summeret oversigt med totaler.\n• Fra 📋 Vis registreringer… eksporterer du kun én kunde eller ét projekt."
  en: "• 📤 Export… (Ctrl+E) saves entries for a period: today, a week, a month or from–to.\n• Excel gets two sheets: all entries and a summary with totals.\n• From 📋 Show entries… you export just one customer or project."
help.bar:
  da: "Sammenfoldet bjælke"
  en: "Collapsed bar"
help.bar_body:
  da: "• 🗕 øverst til højre (Ctrl+M) folder vinduet sammen til en lille bjælke med tid og knapper. 🗖 folder det ud igen.\n• Træk hvor som helst i bjælken (ikke på knapperne) for at flytte den.\n• 🔀 skifter projekt. Under ☰ → Sammenfoldet bjælke kan bjælken stå lodret i siden af skærmen."
  en: "• 🗕 at the top right (Ctrl+M) collapses the window into a small bar with time and buttons. 🗖 expands it again.\n• Drag anywhere on the bar (not on the buttons) to move it.\n• 🔀 switches project. Under ☰ → Collapsed bar, the bar can stand vertically at the side of the screen."
help.shortcuts:
  da: "Genvejstaster"
  en: "Keyboard shortcuts"
help.shortcuts_body:
  da: "• F1 åbner denne hjælp. Ctrl+K skifter projekt, Ctrl+P holder pause, Ctrl+T tager telefonen, og Ctrl+S stopper.\n• På Windows virker nogle genveje også fra andre programmer, f.eks. Ctrl+Alt+P for pause.\n• Alle genveje kan ændres."
  en: "• F1 opens this help. Ctrl+K switches project, Ctrl+P takes a break, Ctrl+T starts a phone call and Ctrl+S stops.\n• On Windows some shortcuts also work from other programs, e.g. Ctrl+Alt+P for a break.\n• All shortcuts can be changed."
help.away:
  da: "Væk fra computeren og pauser"
  en: "Away from the computer and breaks"
help.away_body:
  da: "• Har du været væk, mens tiden kørte, spørger KronoLog, om tiden skal være pause (☰ → Væk fra computeren).\n• Har computeren sovet, er tiden stoppet, mens den sov, og du kan fortsætte bagefter.\n• ☰ → Pausepåmindelse foreslår en kort pause, når du har arbejdet længe.\n• Arbejder du et stykke tid uden at tage tid, spørger KronoLog \"Glemt at starte tiden?\" og kan starte tiden fra dengang."
  en: "• If you were away while time was running, KronoLog asks whether the time should be a break (☰ → Away from the computer).\n• If the computer was asleep, the time stopped while it slept, and you can continue afterwards.\n• ☰ → Break reminder suggests a short break when you have worked for a long time.\n• If you work for a while without recording time, KronoLog asks \"Forgot to start the time?\" and can start it from back then."
help.breathing:
  da: "Åndedrætsøvelser"
  en: "Breathing exercises"
help.breathing_body:
  da: "• 💨 under en pause starter en kort guidet vejrtrækning. Vælg øvelse og længde under ☰ → Åndedrætsøvelse.\n• + ved øvelserne laver din egen øvelse med ind, hold, ud og hold.\n• 🔥 viser, hvor mange dage i træk du har øvet."
  en: "• 💨 during a break starts a short guided breathing exercise. Choose exercise and length under ☰ → Breathing exercise.\n• + next to the exercises creates your own with in, hold, out and hold.\n• 🔥 shows how many days in a row you have practised."
help.tray:
  da: "Systembakke og opdateringer"
  en: "System tray and updates"
help.tray_body:
  da: "• Lukker du vinduet, lægger KronoLog sig i systembakken, og tiden kører videre. Klik på ikonet for at vise vinduet; højreklik for en menu.\n• Den røde prik på ikonet viser, at tiden kører.\n• KronoLog søger selv efter nye versioner og viser et banner, når der er en (☰ → Opdateringer).\n• Hver dag gemmes en sikkerhedskopi af dine data; de sidste 14 dage kan gendannes under ☰ → Sikkerhedskopi."
  en: "• If you close the window, KronoLog goes to the system tray and the time keeps running. Click the icon to show the window; right-click for a menu.\n• The red dot on the icon shows that time is running.\n• KronoLog checks for new versions by itself and shows a banner when there is one (☰ → Updates).\n• A backup of your data is saved every day; the last 14 days can be restored under ☰ → Backup."
